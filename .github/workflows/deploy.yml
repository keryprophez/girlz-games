name: Deploy sur GitHub Pages

on:
  push:
    # La branche claude/* est encore la branche par défaut du repo et
    # l'environnement github-pages n'accepte QU'ELLE. `main` n'est plus un
    # déclencheur : une livraison pousse les deux branches à quelques
    # secondes d'écart, et les deux runs, dans le même groupe `pages` avec
    # cancel-in-progress, s'annulaient l'un l'autre — quand c'est celui de
    # main qui survivait, il échouait au déploiement (15/09). Une fois main
    # passée par défaut dans Settings → General, la remettre ici seule.
    branches: [claude/magic-farm-game-q66bw4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Smoke test : chaque jeu doit se monter sans erreur avant de déployer
      - run: npm run test:smoke
      # Bots de jeu : les parcours clés doivent être GAGNABLES avant de déployer
      # (se saute tout seul si le runner n'a pas de WebGL utilisable)
      - run: npm run test:play
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
