name: Mise en ligne sur Cloudflare

# Une seule branche publie : `main` (https://girlz-games.tld83.workers.dev).
# Ne jamais élargir `branches`, sinon chaque branche de travail écrase la prod.
#
# CI LÉGÈRE (9/10, le dépôt devient privé) : les minutes de GitHub Actions
# d'un compte sont un seul quota pour tous ses dépôts privés (2 000 par mois
# en Free). L'ancienne CI ouvrait tous les jeux dans un navigateur 3D à
# chaque envoi (20 à 40 min, ~2 300 min le mois dernier). Ici : lint, tests,
# build, déploiement (quelques minutes). Le smoke (tous les jeux) et les bots
# des jeux touchés tournent dans la session AVANT l'envoi sur `main`
# (CLAUDE.md, « Méthode de travail »).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".claude/**"
  workflow_dispatch:

# Jamais deux mises en ligne à la fois ; la plus récente attend au lieu
# d'annuler l'autre : le dernier envoi finit toujours en ligne.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # tsc (l'app et le Worker, strict) puis vite build
      - run: npm run build
      # Le premier run échoue ici tant que le secret CLOUDFLARE_API_TOKEN du
      # dépôt n'existe pas : c'est normal, le poser puis relancer.
      # Les secrets du Worker (ACCESS_CODE, ACCESS_SIGNING_SECRET,
      # ANTHROPIC_API_KEY) se posent dans le tableau de bord Cloudflare et
      # survivent aux déploiements : ils ne passent jamais par GitHub.
      - name: Déployer le Worker
        uses: cloudflare/wrangler-action@v4
        with:
          # account_id est lu dans wrangler.jsonc : le token est le seul secret
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
