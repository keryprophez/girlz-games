name: Deploy sur GitHub Pages

on:
  push:
    # `main` est la branche par défaut du repo depuis le 23/09 : c'est elle,
    # et elle seule, qui publie. (Avant, la branche claude/magic-farm-game-
    # q66bw4 était la seule acceptée, et pousser les deux branches faisait
    # s'annuler deux runs dans le groupe `pages` — 15/09.)
    branches: [main]
  workflow_dispatch:
    inputs:
      bots:
        description: "Bots : vide = ceux des jeux touchés depuis la dernière mise en ligne, « tous » = tous"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # retrouver la dernière mise en ligne réussie (scripts/touched.mjs)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tout l'historique : comparer avec la dernière mise en ligne
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Smoke test : chaque jeu doit se monter sans erreur avant de déployer
      - run: npm run test:smoke
      # Bots de jeu : seulement ceux des jeux TOUCHÉS depuis la dernière mise
      # en ligne réussie (2/10 : « on ne valide via bot que les jeux que l'on
      # touche »). Un module commun ne déclenche aucun bot : le smoke ci-dessus
      # a déjà ouvert tous les jeux. Lancement manuel avec « tous » : tous.
      - id: touched
        run: node scripts/touched.mjs --ci
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          BOTS_FORCE: ${{ inputs.bots }}
      # (se saute tout seul si le runner n'a pas de WebGL utilisable)
      - if: steps.touched.outputs.run == 'true'
        run: npm run test:play
        env:
          BOTS: ${{ steps.touched.outputs.bots }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
