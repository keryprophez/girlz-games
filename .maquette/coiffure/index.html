<title>Salon de coiffure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--fond:#F6E7DA;--encre:#45362A;--carte:#FFFDF6;--accent:#F0A03C}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--encre);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#scene{position:absolute;inset:0}
#scene canvas{width:100%;height:100%;display:block}
.barre{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-end;gap:18px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.groupe{display:flex;gap:10px;align-items:flex-end;pointer-events:auto;background:rgba(255,253,246,.72);padding:8px 12px;border-radius:22px;backdrop-filter:blur(6px)}
.outil{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700}
button{border:0;cursor:pointer;font:inherit;color:inherit}
.rond{width:58px;height:58px;border-radius:50%;background:var(--carte);box-shadow:0 3px 0 rgba(69,54,42,.18);display:grid;place-items:center}
.rond svg{width:32px;height:32px}
.rond.sel{outline:4px solid var(--accent)}
.teinte{width:40px;height:40px;border-radius:50%;border:3px solid var(--carte);box-shadow:0 2px 0 rgba(69,54,42,.2)}
.teinte.sel{outline:4px solid var(--accent)}
.tete{padding:8px 12px;border-radius:14px;background:var(--carte);font-weight:700;font-size:13px}
.tete.sel{outline:3px solid var(--accent)}
#fps{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));font:12px ui-monospace,monospace;background:rgba(255,255,255,.7);padding:3px 8px;border-radius:8px}
#charge{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:700}
.pret #charge{display:none}
#err{position:absolute;left:12px;top:12px;color:#B00020;font-weight:700}
button:focus-visible{outline:3px solid #41C26A}
</style>
<div id="scene"></div>
<div id="charge">Chargement de la tête…</div>
<div id="err"></div>
<div id="fps"></div>
<div class="barre">
  <div class="groupe">
    <span class="outil"><button class="rond sel" data-mode="main" aria-label="Attraper les cheveux"><svg viewBox="0 0 24 24"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11m0-5.5V4a1.5 1.5 0 0 1 3 0v7m0-5.5a1.5 1.5 0 0 1 3 0V12m0-4a1.5 1.5 0 0 1 3 0v6.5a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.7-2.9L4 15.3a1.6 1.6 0 0 1 2.5-2L8 15" fill="#FFE2C8" stroke="#45362A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>Main</span>
    <span class="outil"><button class="rond" data-mode="brosse" aria-label="Brosser"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="12" height="8" rx="4" fill="#E8427C"/><path d="M5 12v3.5M8 12v4.5M11 12v4.5M14 12v3.5" stroke="#45362A" stroke-width="1.6" stroke-linecap="round"/><rect x="14" y="6.5" width="8" height="3" rx="1.5" fill="#C99A5F"/></svg></button>Brosse</span>
  </div>
  <div class="groupe">
    <button class="teinte" data-teinte="0" aria-label="Blond"></button>
    <button class="teinte sel" data-teinte="1" aria-label="Châtain"></button>
    <button class="teinte" data-teinte="2" aria-label="Roux"></button>
    <button class="teinte" data-teinte="3" aria-label="Brun"></button>
    <button class="teinte" data-teinte="4" aria-label="Noir"></button>
  </div>
</div>
<script type="module" src="demo.js"></script>
